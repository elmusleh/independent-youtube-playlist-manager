# docker-compose.test.yml — provisions Postgres + PostgREST for E2E sync tests
# Usage: docker compose -f docker-compose.test.yml up -d
#        npx vitest run --config vitest.config.mjs src/services/sync/e2e-relay.test.ts
#        docker compose -f docker-compose.test.yml down
version: "3.8"

services:
  pg:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: audit
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:3311:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 10

  postgrest:
    image: postgrest/postgrest:latest
    ports:
      - "127.0.0.1:3312:3000"
    environment:
      PGRST_DB_URI: "postgres://postgres:audit@pg:5432/postgres"
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: "audit-local-jwt-secret-0123456789abcdef0123456789"
    depends_on:
      pg:
        condition: service_healthy
    # Apply schema on startup
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for Postgres..."
        until pg_isready -h pg -U postgres; do sleep 1; done
        echo "Applying schema..."
        PGPASSWORD=audit psql -h pg -U postgres -v ON_ERROR_STOP=1 -f /tmp/relay.sql || true
        exec postgrest
    volumes:
      - ./docs/sync-relay-v2.sql:/tmp/relay.sql:ro
