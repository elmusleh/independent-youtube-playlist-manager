# Configures auto-generated GitHub Release notes categories
# https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes
changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - dependabot
  categories:
    - title: "🚀 New Features"
      labels:
        - feat
        - feature
    - title: "🐛 Bug Fixes"
      labels:
        - fix
        - bug
    - title: "⚡ Performance"
      labels:
        - perf
    - title: "🔒 Security"
      labels:
        - security
    - title: "🏗️ Build & CI"
      labels:
        - build
        - ci
    - title: "📦 Dependencies"
      labels:
        - dependencies
    - title: "📝 Documentation"
      labels:
        - docs
        - documentation
    - title: "🔧 Other Changes"
      labels:
        - "*"
