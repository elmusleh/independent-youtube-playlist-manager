# AUTO-GENERATED by elmusleh/ci-autofix — edit the template, not this file.
# Source: https://github.com/elmusleh/ci-autofix
#
# Merges a bot-created autofix PR ONLY when every safety gate passes:
#   - AUTOFIX_AUTO_MERGE == "true" (repo variable, default false)
#   - branch starts with ci-autofix/
#   - PR authored by a bot, labelled ci-autofix:fixed, not ci-autofix:skip
#   - diff <= 400 changed lines
#   - no workflows, lockfiles, manifests, secrets, infra or migrations touched
#   - every check green and PR mergeable
name: CI Autofix Merge

on:
  workflow_run:
    workflows:
      - "CI / Verification"
    types: [completed]

concurrency:
  group: ci-autofix-merge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: read
  checks: read

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'ci-autofix/') &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.AUTOFIX_MERGE_TOKEN || secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      AUTO_MERGE: ${{ vars.AUTOFIX_AUTO_MERGE || 'false' }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
    steps:
      - name: Gate on opt-in
        id: optin
        run: |
          set -euo pipefail
          if [ "$AUTO_MERGE" != "true" ]; then
            echo "AUTOFIX_AUTO_MERGE is not true — leaving PR for review."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Find autofix PR
        id: pr
        if: steps.optin.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$HEAD_BRANCH" --state open \
                  --json number --jq '.[0].number // empty')"
          if [ -z "$pr" ]; then
            echo "No open PR for $HEAD_BRANCH"
            echo "number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # NOTE: use a non-whitespace delimiter. With IFS=$'\t' bash collapses
          # empty fields, which silently shifts labels/additions/deletions.
          meta="$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" \
                    --json isDraft,author,labels,additions,deletions \
                    --jq '[.isDraft, .author.login, .author.is_bot,
                           ([.labels[].name] | join("|")), .additions, .deletions] | join("|")')"
          IFS='|' read -r draft author is_bot labels additions deletions <<<"$meta"

          echo "PR #$pr author=$author bot=$is_bot draft=$draft +/-$additions/$deletions labels=$labels"

          block=""
          [ "$is_bot" = "true" ] || block="not-bot-authored"
          [ "$draft" = "false" ] || block="draft"
          case ",$labels," in
            *,ci-autofix:fixed,*) ;;
            *) block="${block:-missing-fixed-label}" ;;
          esac
          case ",$labels," in
            *,ci-autofix:skip,*) block="opted-out" ;;
          esac
          if [ "$((additions + deletions))" -gt 400 ]; then block="diff-too-large"; fi

          echo "number=$pr" >> "$GITHUB_OUTPUT"
          echo "block=$block" >> "$GITHUB_OUTPUT"

      - name: Check touched paths
        id: paths
        if: steps.optin.outputs.enabled == 'true' && steps.pr.outputs.number != '' && steps.pr.outputs.block == ''
        env:
          PR: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only > /tmp/changed.txt
          cat /tmp/changed.txt

          if [ ! -s /tmp/changed.txt ]; then
            echo "block=empty-diff" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if grep -Eq '^(\.github/|\.gitlab-ci|Dockerfile|docker-compose|\.?[^/]*\.ya?ml$|.*\.lock$|package(-lock)?\.json$|pnpm-lock\.yaml$|yarn\.lock$|npm-shrinkwrap\.json$|pyproject\.toml$|requirements[^/]*\.txt$|setup\.(py|cfg)$|Pipfile(\.lock)?$|poetry\.lock$|uv\.lock$|Cargo\.(toml|lock)$|go\.(mod|sum)$|\.env|\.env\..*|.*\.(pem|key|p12|pfx|crt)$|.*secret.*|.*credential.*|migrations?/|alembic/|terraform/|\.terraform/|k8s/|kubernetes/|helm/|infra/|deploy/)' /tmp/changed.txt; then
            grep -En '^(\.github/|\.gitlab-ci|Dockerfile|docker-compose|\.?[^/]*\.ya?ml$|.*\.lock$|package(-lock)?\.json$|pnpm-lock\.yaml$|yarn\.lock$|npm-shrinkwrap\.json$|pyproject\.toml$|requirements[^/]*\.txt$|setup\.(py|cfg)$|Pipfile(\.lock)?$|poetry\.lock$|uv\.lock$|Cargo\.(toml|lock)$|go\.(mod|sum)$|\.env|\.env\..*|.*\.(pem|key|p12|pfx|crt)$|.*secret.*|.*credential.*|migrations?/|alembic/|terraform/|\.terraform/|k8s/|kubernetes/|helm/|infra/|deploy/)' /tmp/changed.txt
            echo "block=sensitive-path" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "block=" >> "$GITHUB_OUTPUT"

      - name: Wait for all checks
        id: checks
        if: steps.optin.outputs.enabled == 'true' && steps.pr.outputs.number != '' && steps.pr.outputs.block == '' && steps.paths.outputs.block == ''
        env:
          PR: ${{ steps.pr.outputs.number }}
        run: |
          set -uo pipefail
          rc=0
          timeout 1200 gh pr checks "$PR" --repo "$GITHUB_REPOSITORY" --watch --interval 20 || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "block=checks-not-green (exit $rc)"
            echo "block=checks-not-green" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          state="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json mergeable,mergeStateStatus \
                    --jq '.mergeable + " " + .mergeStateStatus')"
          echo "merge state: $state"
          case "$state" in
            "MERGEABLE CLEAN"|"MERGEABLE HAS_HOOKS") echo "block=" >> "$GITHUB_OUTPUT" ;;
            *) echo "block=not-mergeable ($state)" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Merge
        id: merge
        if: steps.optin.outputs.enabled == 'true' && steps.pr.outputs.number != '' && steps.pr.outputs.block == '' && steps.paths.outputs.block == '' && steps.checks.outputs.block == ''
        env:
          PR: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body \
            "Auto-merged: every check passed, the diff is small, and no sensitive paths were touched. Triggered by ${RUN_URL}." >/dev/null 2>&1 || true
          echo "merged=true" >> "$GITHUB_OUTPUT"

      - name: Summarise
        if: always()
        env:
          ENABLED: ${{ steps.optin.outputs.enabled }}
          NUMBER: ${{ steps.pr.outputs.number }}
          BLOCK: ${{ steps.pr.outputs.block }}${{ steps.paths.outputs.block }}${{ steps.checks.outputs.block }}
          MERGED: ${{ steps.merge.outputs.merged }}
        run: |
          if [ "$ENABLED" != "true" ]; then
            echo "Auto-merge disabled (AUTOFIX_AUTO_MERGE != true)." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$MERGED" = "true" ]; then
            echo "Merged autofix PR #$NUMBER." >> "$GITHUB_STEP_SUMMARY"
          elif [ -z "$NUMBER" ]; then
            echo "No open autofix PR for this run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Left autofix PR #$NUMBER for review: ${BLOCK:-unknown}." >> "$GITHUB_STEP_SUMMARY"
          fi
