name: Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 6 AM UTC
  workflow_dispatch:

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Dependency Review
        uses: actions/dependency-review-action@v4

  npm-audit:
    name: npm Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            apps/browser-extension/playlist-manager/package-lock.json
            apps/web-portal/package-lock.json
      - name: Install Root Dependencies
        run: npm ci
      - name: Audit Root Dependencies
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: Install Extension Dependencies
        run: cd apps/browser-extension/playlist-manager && npm ci
      - name: Audit Extension Dependencies
        run: cd apps/browser-extension/playlist-manager && npm audit --audit-level=high
        continue-on-error: true
      - name: Install Web Dependencies
        run: npm --prefix apps/web-portal ci
      - name: Audit Web Dependencies
        run: cd apps/web-portal && npm audit --audit-level=high
        continue-on-error: true

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
