# AUTO-GENERATED by elmusleh/ci-autofix — edit the template, not this file.
# Source: https://github.com/elmusleh/ci-autofix
name: CI Autofix

on:
  workflow_run:
    workflows:
      - "CI / Verification"
    types: [completed]

concurrency:
  group: ci-autofix-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  autofix:
    # SECURITY: workflow_run runs with write permissions. Restrict the job to
    # failures from THIS repository so a fork can never reach the checkout. The
    # shell guard repeats this check as defence in depth.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event != 'schedule' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      FIXER: ${{ vars.FIXER || 'claude' }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
      ACTOR: ${{ github.event.workflow_run.actor.login }}
      EVENT: ${{ github.event.workflow_run.event }}
    steps:
      - name: Guard
        id: guard
        run: |
          set -euo pipefail
          skip=""
          pr=""

          if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then skip="fork"; fi
          case "$HEAD_BRANCH" in ci-autofix/*) skip="own-branch" ;; esac
          case "$ACTOR" in *"[bot]") skip="bot" ;; esac

          if [ -z "$skip" ]; then
            perm="$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission" --jq .permission 2>/dev/null || echo none)"
            case "$perm" in
              admin|maintain|write) ;;
              *) skip="no-write" ;;
            esac
          fi

          if [ -z "$skip" ]; then
            pr="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.pull_requests[0].number // empty' 2>/dev/null || true)"
          fi
          if [ -z "$skip" ] && [ -z "$pr" ]; then
            pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$HEAD_BRANCH" --state open --json number --jq '.[0].number // empty' 2>/dev/null || true)"
          fi

          if [ -n "$pr" ] && [ -z "$skip" ]; then
            gh label create "ci-autofix:attempted" --force --color BFD4F2 --description "CI autofix already attempted" >/dev/null 2>&1 || true
            gh label create "ci-autofix:skip" --force --color E4E669 --description "Skip CI autofix" >/dev/null 2>&1 || true
            labels="$(gh pr view "$pr" --json labels --jq '.labels[].name' 2>/dev/null || true)"
            if printf '%s\n' "$labels" | grep -qx "ci-autofix:skip"; then skip="opted-out"; fi
            if printf '%s\n' "$labels" | grep -qx "ci-autofix:attempted"; then skip="already-attempted"; fi
          fi

          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "guard: pr=${pr:-none} skip=${skip:-none}"

      - name: Fetch failed logs
        if: steps.guard.outputs.skip == ''
        run: |
          set -euo pipefail
          gh run view "$RUN_ID" --log-failed > /tmp/ci-failed.log 2>&1 || true
          if [ ! -s /tmp/ci-failed.log ]; then
            gh run view "$RUN_ID" --log > /tmp/ci-failed.log 2>&1 || true
          fi
          if [ -s /tmp/ci-failed.log ]; then
            tail -c 60000 /tmp/ci-failed.log > /tmp/ci-failed.tail.log
            mv /tmp/ci-failed.tail.log /tmp/ci-failed.log
          fi
          echo "log_bytes=$(wc -c < /tmp/ci-failed.log)"

      - name: Classify failure
        id: classify
        if: steps.guard.outputs.skip == ''
        run: |
          set -euo pipefail
          bail=""
          if grep -Eiq 'timed out|timeout|cancelled|canceled|out of memory|oom|no space left|runner.*lost|network is unreachable|connection reset|temporary failure|rate limit|resource not accessible|permission denied|audit-level|vulnerabilit|flaky' /tmp/ci-failed.log; then
            bail="infra-or-flaky"
          fi
          echo "bail=$bail" >> "$GITHUB_OUTPUT"
          echo "classification=${bail:-code}"

      - name: Check fixer credential
        id: cred
        if: steps.guard.outputs.skip == '' && steps.classify.outputs.bail == ''
        env:
          CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          ok="false"
          reason=""
          if [ "$FIXER" = "disabled" ]; then
            reason="FIXER=disabled"
          elif [ "$FIXER" = "claude" ]; then
            if [ -n "$CLAUDE_TOKEN" ] || [ -n "$ANTHROPIC_KEY" ]; then
              ok="true"
            else
              reason="No Claude credential configured. Add CLAUDE_CODE_OAUTH_TOKEN."
            fi
          else
            reason="Unsupported FIXER=$FIXER"
          fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "credential: ok=$ok ${reason}"

      - name: Checkout failing commit
        if: steps.cred.outputs.ok == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare branch and prompt
        id: prep
        if: steps.cred.outputs.ok == 'true'
        env:
          GUARD_PR: ${{ steps.guard.outputs.pr }}
        run: |
          set -euo pipefail
          git config user.name "ci-autofix[bot]"
          git config user.email "ci-autofix@users.noreply.github.com"

          if [ -n "$GUARD_PR" ]; then
            mode="self-heal"
            target="$HEAD_BRANCH"
            git checkout -B "$target" "$HEAD_SHA"
            git branch --set-upstream-to="origin/$target" "$target" >/dev/null 2>&1 || true
          else
            mode="new-pr"
            target="ci-autofix/$RUN_ID"
            git checkout -B "$target" "$HEAD_SHA"
          fi

          # Consume the attempt only now: a dormant run (no credential) must not
          # burn the one attempt the PR is allowed.
          if [ -n "$GUARD_PR" ]; then
            gh label create "ci-autofix:attempted" --force --color BFD4F2 --description "CI autofix already attempted" >/dev/null 2>&1 || true
            gh pr edit "$GUARD_PR" --add-label "ci-autofix:attempted" >/dev/null 2>&1 || true
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"

          cat > /tmp/ci-prompt.txt <<PROMPT
          You are the CI autofix agent for ${GITHUB_REPOSITORY}.

          A CI run failed.
          - Failed run: ${RUN_URL}
          - Run ID: ${RUN_ID}
          - Branch: ${HEAD_BRANCH}
          - Commit: ${HEAD_SHA}
          - Event: ${EVENT}
          - Pull request: #${GUARD_PR}
          - Mode: ${mode}
          - Target branch: ${target}
          - Failed log (truncated, last 60 KB): /tmp/ci-failed.log

          Read AGENTS.md, CLAUDE.md and .ai-sync/*.md in the repository before changing anything. Follow them.

          Rules:
          1. Reproduce the failure with the repository's own commands. Do not guess.
          2. If the failure is infrastructure (timeout, cancelled, OOM, disk, network, runner), a dependency audit/vulnerability finding, or a flaky end-to-end test, do NOT change code. Bail.
          3. Make the smallest change that fixes the root cause. No refactors, no new features, no dependency upgrades unless the failure is directly caused by a dependency.
          4. Run the repository's verification commands before committing. If they still fail after two attempts, bail.
          5. Do not modify .github/workflows, secrets, or lockfiles unless the failure cannot be fixed otherwise. Never force-push. Never merge.
          6. Commit with message: fix(ci): <short reason> [skip autofix]
          7. If mode is self-heal, push the commit to ${target}.
             If mode is new-pr, push ${target} and open a draft pull request:
             gh pr create --draft --base "${HEAD_BRANCH}" --head "${target}" --title "fix(ci): autofix for run ${RUN_ID}" --body "Automated fix for failed CI run ${RUN_URL}. Review before merging."
          8. Write /tmp/ci-autofix-result.json with this shape:
             {"status":"fixed"|"bail","reason":"...","summary":"plain-English explanation","files":["..."],"verify":"command and result","next":"what the human should do"}
          9. The summary is for a beginner: explain what broke, why the fix works, and how confident you are. Keep it under 200 words.
          10. If the log looks unrelated to the code (flaky, infrastructure), bail instead of inventing a patch.

          If you cannot fix it, write status "bail" with a clear reason and stop.
          PROMPT

          {
            echo 'prompt_text<<CI_AUTOFIX_PROMPT'
            cat /tmp/ci-prompt.txt
            echo 'CI_AUTOFIX_PROMPT'
          } >> "$GITHUB_OUTPUT"

      - name: Fix with Claude
        id: fix
        if: steps.cred.outputs.ok == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.prep.outputs.prompt_text }}
          claude_args: |
            --max-turns ${{ vars.AUTOFIX_MAX_TURNS || '20' }}
            --allowedTools "Edit,Write,Read,Glob,Grep,LS,Bash(git:*),Bash(gh:*),Bash(npm:*),Bash(npx:*),Bash(pnpm:*),Bash(yarn:*),Bash(bun:*),Bash(node:*),Bash(deno:*),Bash(python:*),Bash(python3:*),Bash(pytest:*),Bash(pip:*),Bash(uv:*),Bash(ruff:*),Bash(black:*),Bash(mypy:*),Bash(make:*),Bash(cmake:*),Bash(ninja:*),Bash(cargo:*),Bash(go:*),Bash(dotnet:*),Bash(mvn:*),Bash(gradle:*),Bash(ruby:*),Bash(bundle:*),Bash(php:*),Bash(composer:*),Bash(swift:*),Bash(xcodebuild:*),Bash(flutter:*),Bash(dart:*),Bash(ros2:*),Bash(colcon:*),Bash(shellcheck:*),Bash(bats:*),Bash(eslint:*),Bash(prettier:*),Bash(tsc:*),Bash(vitest:*),Bash(jest:*),Bash(playwright:*),Bash(bash:*),Bash(sh:*),Bash(cat:*),Bash(cp:*),Bash(diff:*),Bash(echo:*),Bash(env:*),Bash(find:*),Bash(grep:*),Bash(head:*),Bash(jq:*),Bash(ls:*),Bash(mkdir:*),Bash(mv:*),Bash(printf:*),Bash(rm:*),Bash(sed:*),Bash(sort:*),Bash(tail:*),Bash(tee:*),Bash(test:*),Bash(touch:*),Bash(uniq:*),Bash(wc:*),Bash(which:*),Bash(xargs:*)"

      - name: Evaluate result
        id: result
        if: steps.cred.outputs.ok == 'true'
        run: |
          set -euo pipefail
          status="failed"
          reason="agent did not produce a result"
          summary=""

          if [ -f /tmp/ci-autofix-result.json ]; then
            status="$(jq -r '.status // "failed"' /tmp/ci-autofix-result.json)"
            reason="$(jq -r '.reason // ""' /tmp/ci-autofix-result.json)"
            summary="$(jq -r '.summary // ""' /tmp/ci-autofix-result.json)"
          fi

          case "$status" in
            fixed|bail) ;;
            *) status="failed" ;;
          esac

          if [ "$status" = "fixed" ] && [ "$(git rev-parse HEAD)" = "$HEAD_SHA" ]; then
            status="bail"
            reason="reported fixed but produced no commit"
          fi

          {
            echo "status=$status"
            echo "reason=$reason"
            echo "summary<<SUMMARY_EOF"
            printf '%s\n' "$summary"
            echo "SUMMARY_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "evaluated: $status ${reason}"

      - name: Report
        if: always()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GUARD_PR: ${{ steps.guard.outputs.pr }}
          SKIP: ${{ steps.guard.outputs.skip }}
          BAIL: ${{ steps.classify.outputs.bail }}
          CRED_OK: ${{ steps.cred.outputs.ok }}
          CRED_REASON: ${{ steps.cred.outputs.reason }}
          STATUS: ${{ steps.result.outputs.status }}
          REASON: ${{ steps.result.outputs.reason }}
          SUMMARY: ${{ steps.result.outputs.summary }}
          MODE: ${{ steps.prep.outputs.mode }}
          TARGET: ${{ steps.prep.outputs.target }}
        run: |
          set -euo pipefail

          if [ -n "$SKIP" ]; then
            echo "Skipped: $SKIP"
            echo "### CI Autofix skipped: $SKIP" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ -n "$BAIL" ]; then
            status="bail"
            reason="failure looks like $BAIL, not a code bug"
            summary="Autofix did not change code because the failure looks infrastructural or flaky. Re-run the job; if it persists, inspect the log."
          elif [ "$CRED_OK" != "true" ]; then
            status="not-configured"
            reason="$CRED_REASON"
            summary="Autofix is installed but has no credential yet. Add CLAUDE_CODE_OAUTH_TOKEN to this repository (or set FIXER=disabled to silence this message)."
          else
            status="${STATUS:-failed}"
            reason="${REASON:-}"
            summary="${SUMMARY:-No summary was produced.}"
          fi

          pr="$GUARD_PR"
          if [ -z "$pr" ] && [ -n "$TARGET" ]; then
            pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$TARGET" --state open --json number --jq '.[0].number // empty' 2>/dev/null || true)"
          fi

          body="$(printf '### CI Autofix: %s\n\n%s\n\n%s\n\nRun: %s' "$status" "$summary" "${reason:+Reason: $reason}" "$RUN_URL")"

          if [ -n "$pr" ]; then
            gh label create "ci-autofix:fixed" --force --color 0E8A16 --description "Autofix produced a fix" >/dev/null 2>&1 || true
            gh label create "ci-autofix:needs-human" --force --color D93F0B --description "Autofix needs a human" >/dev/null 2>&1 || true
            if [ "$status" = "fixed" ]; then
              gh pr edit "$pr" --add-label "ci-autofix:fixed" >/dev/null 2>&1 || true
            else
              gh pr edit "$pr" --add-label "ci-autofix:needs-human" >/dev/null 2>&1 || true
            fi
            gh pr comment "$pr" --body "$body" >/dev/null 2>&1 || true
          fi

          {
            echo "### CI Autofix: $status"
            echo
            echo "$summary"
            echo
            echo "- run: $RUN_URL"
            echo "- branch: \`$HEAD_BRANCH\`"
            echo "- mode: ${MODE:-none}"
            echo "- reason: ${reason:-n/a}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$NTFY_TOPIC" ]; then
            curl -s -m 10 -H "Title: CI autofix: $status" -d "$summary" "https://ntfy.sh/$NTFY_TOPIC" >/dev/null 2>&1 || true
          fi

          case "$status" in
            fixed|bail|not-configured) exit 0 ;;
            *) exit 1 ;;
          esac
