name: Build Safari Extension

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-safari:
    name: Build & Convert Safari Extension
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: |
          npm ci
          cd apps/browser-extension/playlist-manager && npm ci
          cd ../../..

      - name: Build WebExtension
        run: npm run build

      - name: Convert to Safari Extension
        run: |
          xcrun safari-web-extension-converter dist/chrome \
            --project-location ./safari-extension \
            --non-interactive

      - name: Zip Safari Extension Project
        run: |
          zip -r safari-extension-project.zip safari-extension

      - name: Upload Safari Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: safari-extension-project
          path: safari-extension-project.zip
          retention-days: 14
