name: CI / Verification

on:
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-security:
    name: Quality & Security (Lint, Format, Audit, Unit Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            apps/browser-extension/playlist-manager/package-lock.json

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Playlist Editor Dependencies
        run: cd apps/browser-extension/playlist-manager && npm ci

      - name: Run Full Quality Check (lint + format + test + svelte-check)
        run: npm run check

      - name: Audit Dependencies
        run: npm audit --audit-level=high

  test-web:
    name: Web & Extension E2E Integration (Typecheck, Build, E2E)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: |
            apps/web-portal/package-lock.json
            apps/browser-extension/playlist-manager/package-lock.json
            package-lock.json

      - name: Install Project & Extension Dependencies
        run: |
          npm ci
          cd apps/browser-extension/playlist-manager && npm ci

      - name: Build Extension (Chrome, Firefox & Edge Bundles)
        run: npm run build

      - name: Install Web Dependencies
        run: npm --prefix apps/web-portal ci

      # Browsers live in one shared cache (~/.cache/ms-playwright) keyed by Playwright
      # version, so a tree whose version is not installed fails with a missing-executable
      # error that looks like a flake. Install for BOTH trees: the portal runs the E2E
      # suite, the root runs the extension regression suite. When the versions agree the
      # second call is a cache hit; when they drift, both builds exist and neither suite
      # breaks. `verify-tooling-versions.js` is what stops the drift in the first place.
      - name: Install Playwright Browsers (Portal)
        run: npx --prefix apps/web-portal playwright install --with-deps chromium

      - name: Install Playwright Browsers (Root — extension suite)
        run: npx playwright install --with-deps chromium

      - name: Run Extension Regression Suite
        run: npm run test:extension

      - name: Build Web Production Bundle
        run: npm --prefix apps/web-portal run build

      - name: Run Playwright E2E Tests (Headed via Xvfb)
        env:
          HEADED: "true"
        run: xvfb-run npm --prefix apps/web-portal run test:e2e

      - name: Upload Playwright Test Report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web-portal/playwright-report/
          retention-days: 7

  test-extension:
    name: Extension CI (Svelte Diagnostics & Manifest Validation)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            apps/browser-extension/playlist-manager/package-lock.json

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Playlist Editor Dependencies
        run: cd apps/browser-extension/playlist-manager && npm ci

      - name: Check Version Sync
        run: |
          node packages/build-tools/sync-version.mjs
          git diff --exit-code apps/browser-extension/manifest.chrome.json apps/browser-extension/manifest.firefox.json package.json || (echo 'Version mismatch detected -- run: npm run sync-version' && exit 1)

      - name: Run Svelte Diagnostics (Typecheck)
        run: cd apps/browser-extension/playlist-manager && npx svelte-check

      - name: Build Extension (Chrome, Firefox & Edge Bundles)
        run: npm run build

      - name: Validate Manifests
        run: node packages/build-tools/validate-manifests.js
