name: Extension Release & Packaging

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-extensions:
    name: Build & Package Browser Extensions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: |
          npm ci
          cd apps/browser-extension/playlist-manager && npm ci

      - name: Sync Versions from Tag
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [[ "$TAG_NAME" =~ ^v[0-9] ]]; then
            VERSION="${TAG_NAME#v}"
            echo "Enforcing version: $VERSION from tag $TAG_NAME"
            node packages/build-tools/sync-version.mjs --set "$VERSION"
          else
            echo "Triggered by branch/dispatch. Syncing standard versions."
            node packages/build-tools/sync-version.mjs
          fi

      - name: Run All Checks
        run: npm run check

      - name: Package Chrome, Firefox and Edge Extensions
        run: npm run pack

      - name: Verify Loaded Extension
        run: |
          npx playwright install --with-deps chromium
          npm run test:extension

      - name: Create and Move Source Code ZIP
        run: |
          git archive --format=zip --output=release-source.zip HEAD
          mkdir -p dist
          mv release-source.zip dist/source-code.zip

      - name: Upload Store ZIP Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: independent-youtube-playlist-manager-extensions
          path: |
            dist/*.zip
          retention-days: 30

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
