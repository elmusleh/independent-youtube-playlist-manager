name: Extension Release & Packaging

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-extensions:
    name: Build & Package Browser Extensions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          cd playlist-editor && npm ci

      - name: Sync Versions (manifests to package.json)
        run: node scripts/sync-version.js

      - name: Package Chrome and Firefox Extensions
        run: npm run pack

      - name: Create Source Code ZIP (git archive)
        run: git archive --format=zip --output=release-source.zip HEAD

      - name: Upload Store ZIP Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: independent-youtube-playlist-manager-extensions
          path: |
            dist/youtube-playlist-helper-chrome.zip
            dist/youtube-playlist-helper-firefox.zip
          retention-days: 30

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/youtube-playlist-helper-chrome.zip
            dist/youtube-playlist-helper-firefox.zip
            release-source.zip
          generate_release_notes: true
          draft: false
          prerelease: false
