version: 2

# Dependabot configuration for independent npm trees and workspace packages.
# Each directory is grouped separately: one PR per directory per week, grouping
# minor and patch dependency updates to reduce PR noise and lockfile fragmentation.

updates:
  # Root: shared tooling — eslint, prettier, vitest, playwright, husky, lint-staged.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm_and_yarn:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Shared crypto workspace package
  - package-ecosystem: "npm"
    directory: "/packages/sync-crypto"
    schedule:
      interval: "weekly"
    groups:
      sync-crypto:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Mobile app workspace
  - package-ecosystem: "npm"
    directory: "/apps/mobile-app"
    schedule:
      interval: "weekly"
    groups:
      mobile-app:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Web portal: Next.js 15 + React 19.
  - package-ecosystem: "npm"
    directory: "/apps/web-portal"
    schedule:
      interval: "weekly"
    groups:
      portal:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Framework majors are migrations, not weekly chores. A major PR that cannot pass
      # CI teaches nobody anything — bump these deliberately, by hand, when ready.
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]

  # Browser extension: Svelte 5 + TypeScript, its own lockfile.
  - package-ecosystem: "npm"
    directory: "/apps/browser-extension/playlist-manager"
    schedule:
      interval: "weekly"
    groups:
      extension:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Svelte 6 would require a full runes migration.
      - dependency-name: "svelte"
        update-types: ["version-update:semver-major"]
