version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm_and_yarn:
        patterns:
          - "*"
    ignore:
      # Svelte 5 requires full migration from Svelte 4 (runes syntax breaking change)
      - dependency-name: "svelte"
        update-types: ["version-update:semver-major"]
      # Vite 6/7 has breaking config API changes; pin to v5.x until ready
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      # esbuild major bumps often need explicit vite/rollup compatibility checks
      - dependency-name: "esbuild"
        update-types: ["version-update:semver-major"]
